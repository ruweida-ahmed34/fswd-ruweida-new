<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Naga soo xiriir Jaamacadda Al-Amal">
  <title>Naga Soo Xiriir - Jaamacadda Al-Amal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="nav-container">
      <div class="logo-section">
        <h1>جامعة الأمل</h1>
        <p>Jaamacadda Al-Amal </p>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="courses.html">Faculties</a></li>
          <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Naga Soo Xiriir</h2>
    <form action="#" method="post" class="contact-form">
      <div class="form-group">
        <label for="fullname">Magacaaga Dhammaystiran</label>
        <input type="text" id="fullname" name="fullname" required placeholder="Geli magacaaga">
      </div>
      <div class="form-group">
        <label for="email">E-mail-kaaga</label>
        <input type="email" id="email" name="email" required placeholder="Geli e-mail-kaaga">
      </div>
      <div class="form-group">
        <label for="subject">Ujeeddada</label>
        <input type="text" id="subject" name="subject" required placeholder="Geli ujeeddada xiriirka">
      </div>
      <div class="form-group">
        <label for="message">Fariintaada</label>
        <textarea id="message" name="message" rows="5" required placeholder="Halkan ku qor fariintaada..."></textarea>
      </div>
      <button type="submit" class="btn">Dir Fariinta</button>
    </form>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2026 Jaamacadda Al-Amal (جامعة الأمل). Dhammaan Xuquuqda Waa La Dhawray.</p>
    </div>
  </footer>

</body>
</html>
